# Duration of individual virtue shrine buffs applied to the activating player
# Default: 00:02:00:00 (2 hours)
# Format: dd:hh:mm:ss
PlayerBuffDuration=00:02:00:00

# Duration of the global world effect from a shrine activation
# Default: 00:02:00:00 (2 hours)
# Format: dd:hh:mm:ss
ShrineEffectDuration=00:02:00:00

# City development multipliers: light shrine and corrupted shrine
# Default: 1.25 (+25%) and 0.85 (-15%)
TownDevelopmentLightMultiplier=1.25
TownDevelopmentDarkMultiplier=0.85

# Invasion chance multipliers for a city: light shrine and corrupted shrine
# Default: 0.75 (-25%) and 1.25 (+25%)
InvasionChanceLightMultiplier=0.75
InvasionChanceDarkMultiplier=1.25

# Dungeon spawn count multipliers: light shrine and corrupted shrine
# Default: 0.70 (-30%) and 1.50 (+50%)
DungeonSpawnCountLightMultiplier=0.70
DungeonSpawnCountDarkMultiplier=1.50

# Dungeon respawn time multipliers: light shrine and corrupted shrine
# Default: 1.50 (+50% delay) and 0.70 (-30% delay)
DungeonRespawnTimeLightMultiplier=1.50
DungeonRespawnTimeDarkMultiplier=0.70
