# If true the champion system will be enabled. If this is ever false on server
# start, all champion spawns will be removed.
Enabled=true

# The time between rotating Felucca / T2A champions
# Default: 1 day.
# Format: dd:hh:mm:ss 
ExpireDelay=00:02:00:00
RotateDelay=00:04:00:00

# Оптимизация золотого дождя для соло: меньше куч (чтобы не перегружать вес сумки), но больше золота в каждой!
GoldPiles=15
GoldMin=12000
GoldMax=18000

# Золото с супер-босса Harrower
HarrowerGoldPiles=25
HarrowerGoldMin=15000
HarrowerGoldMax=30000

# Количество свитков силы (Power Scrolls) после победы над Чемпионом
PowerScrolls=4

# Количество свитков статов (Stat Scrolls) после Harrower
StatScrolls=8

# ШАНС ДРОПА СВИКТОВ С МОБОВ ПОВЫШЕН: поднят до 2.5% (было 0.1%), чтобы соло-фарм приносил доход
ScrollChance=2.5


# Шанс, что выпавший свиток будет Свитком Трансцендентности (опыт), а не свитком статов
TranscendenceChance=50.0


# Настройка порогов свечей для смены рангов мобов
Rank2RedSkulls=5
Rank3RedSkulls=10
Rank4RedSkulls=13

# =========================================================================
# 🧮 КРИТИЧЕСКИЕ ИСПРАВЛЕНИЯ: Количество убийств для соло-игры (УМЕНЬШЕНО)
# =========================================================================
# Количество убийств для перехода уровня на 1 ранге (Свечи 1-4)
Rank1MaxKills=45

# Количество убийств для перехода уровня на 2 ранге (Свечи 5-9)
Rank2MaxKills=35

# Количество убийств для перехода уровня на 3 ранге (Свечи 10-12)
Rank3MaxKills=25

# Количество убийств для перехода уровня на 4 ранге (Свечи 13-16)
Rank4MaxKills=15
# =========================================================================

